[project]
name = "categorizer"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pillow>=13.0.0",
    "selectolax>=1.0.1",
    "typesafe-sdk==0.7.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001", "FLY002"]
