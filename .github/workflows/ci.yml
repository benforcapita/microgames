name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # CI-T1: run the unit suite (node:test). DB tests auto-skip without local Supabase; strict timing tests skip on a loaded runner.
      - run: npm test
      - run: npm run build
      # NM-1: strict site-copy guard (no money/payment terms in user-rendered files or the built output)
      - run: npm run check:copy -- --dist

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
