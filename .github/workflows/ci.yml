name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # CI-T1: run the unit suite (node:test). DB tests auto-skip without local Supabase; strict timing tests skip on a loaded runner.
      - run: npm test
      - run: npm run build
      # NM-1: strict site-copy guard (no money/payment terms in user-rendered files or the built output)
      - run: npm run check:copy -- --dist

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  db-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Supabase CLI
        id: supabase-cli
        uses: actions/cache@v4
        with:
          path: ~/supabase-cli
          key: supabase-cli-${{ runner.os }}-2.120.0
      - name: Install Supabase CLI
        if: steps.supabase-cli.outputs.cache-hit != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Place Supabase CLI on PATH
        run: |
          dir="$HOME/supabase-cli"
          if [ ! -x "$dir/supabase" ]; then
            mkdir -p "$dir"
            install -m 755 "$(command -v supabase)" "$dir/supabase"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - name: Assert Supabase CLI version
        run: test "$(supabase --version)" = "2.120.0"
      - run: npm ci
      # Discard stdout: supabase start prints local anon/service keys and JWTs; errors on stderr still show.
      # Mail (mailpit) is required for smoke and must not be excluded.
      - name: Start local Supabase
        run: supabase start -x vector,logflare,edge-runtime,realtime,studio,imgproxy > /dev/null
      # Masks are registered before export; values come only from supabase status via the loopback guard, never from repo secrets.
      - name: Export local Supabase env (masked)
        run: node --input-type=module -e "import fs from 'node:fs'; import { localSupabaseEnv } from './scripts/lib/local-supabase.mjs'; const env = localSupabaseEnv(); for (const k of ['PUBLIC_SUPABASE_URL', 'PUBLIC_SUPABASE_PUBLISHABLE_KEY', 'SUPABASE_SECRET_KEY', 'DATABASE_URL', 'MAILPIT_URL']) { const v = env[k]; if (!v) { console.error('missing ' + k + ' from supabase status'); process.exit(1); } if (['PUBLIC_SUPABASE_PUBLISHABLE_KEY', 'SUPABASE_SECRET_KEY', 'DATABASE_URL'].includes(k)) console.log('::add-mask::' + v); fs.appendFileSync(process.env.GITHUB_ENV, k + '=' + v + '\n'); }"
      - name: Smoke
        run: npm run smoke
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: DB tests
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/db-tests.tap"
      - name: Assert no DB suites skipped
        run: node scripts/ci/assert-no-db-skips.mjs "$RUNNER_TEMP/db-tests.tap"
      - name: DB e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/db-e2e.json
        run: npx playwright test e2e --reporter=list,json
      - name: Assert no DB e2e tests skipped
        run: node scripts/ci/assert-no-db-skips.mjs "$RUNNER_TEMP/db-e2e.json"
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: Fullscreen e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/fullscreen-e2e.json
        run: npx playwright test --config=playwright.fullscreen.config.mjs --reporter=list,json
      - name: Assert no fullscreen e2e tests skipped
        run: node scripts/ci/assert-no-db-skips.mjs "$RUNNER_TEMP/fullscreen-e2e.json"
      - name: Upload SL-3 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sl3-screenshots-${{ matrix.run }}
          path: test-results/screenshots/sl-3-*.png
      - name: Stop local Supabase
        if: always()
        run: supabase stop

  categorizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/categorizer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          working-directory: workers/categorizer
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python -c "from categorizer import scan_repo; raise SystemExit(scan_repo())"
