<!doctype html><html><head><meta charset="utf-8"><title>Dot</title></head>
<body><canvas id="c"></canvas><script>
const c = document.getElementById('c'), x = c.getContext('2d');
let t0 = performance.now();
function loop(t) { x.clearRect(0, 0, c.width, c.height); x.fillRect((t - t0) / 10 % 300, 50, 10, 10); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
try { localStorage.setItem('best', '1'); } catch (e) {}
window.Meshgrounds?.ready?.();
</script></body></html>
